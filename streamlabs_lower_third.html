<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Streamlabs Lower Third - Auto-Sync TGS 2026</title>
<script src="schedule.js"></script>
<script src="shared_sync.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body {
    background: transparent;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 36px 44px;
  }

  .lower-third-wrapper {
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease;
  }

  .lower-third-wrapper.hidden {
    transform: translateY(150px);
    opacity: 0;
    pointer-events: none;
  }

  .badge-main {
    display: flex;
    align-items: center;
    background: linear-gradient(135deg, rgba(46, 16, 101, 0.97), rgba(109, 40, 217, 0.97));
    color: white;
    padding: 12px 24px 12px 14px;
    border-radius: 20px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    border: 2px solid #a7f3d0;
    max-width: 820px;
    position: relative;
    overflow: hidden;
  }

  .badge-main::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
    animation: sheen 6s infinite;
  }

  @keyframes sheen {
    0%, 70% { left: -100%; }
    100% { left: 160%; }
  }

  .logo-frame {
    width: 78px;
    height: 78px;
    min-width: 78px;
    border-radius: 15px;
    background: #ffffff;
    border: 2px solid rgba(255, 255, 255, 0.85);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    margin-right: 16px;
    overflow: hidden;
  }

  .logo-frame img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }

  .badge-text { display: flex; flex-direction: column; min-width: 0; }
  .top-meta-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }

  .live-tag {
    display: inline-block;
    background: #10b981;
    color: #022c22;
    font-size: 0.68em;
    font-weight: 900;
    padding: 2px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .host-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(216, 180, 254, 0.45);
    color: #f3e8ff;
    font-size: 0.78em;
    font-weight: 800;
    padding: 2px 10px;
    border-radius: 999px;
  }

  .badge-text .title { font-size: 1.45em; font-weight: 900; letter-spacing: 0.3px; line-height: 1.15; text-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  .badge-text .subtitle { font-size: 0.92em; color: #e9d5ff; font-weight: 800; margin-top: 4px; }

  .ticker-bar {
    background: rgba(15, 23, 42, 0.94);
    color: #f8fafc;
    padding: 8px 18px;
    border-radius: 12px;
    font-size: 0.9em;
    font-weight: 800;
    border-left: 5px solid #10b981;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    max-width: 720px;
  }

  .announcement-pill {
    background: linear-gradient(90deg, #dc2626, #ea580c);
    color: white;
    padding: 8px 18px;
    border-radius: 12px;
    font-size: 0.95em;
    font-weight: 900;
    border: 2px solid #fca5a5;
    box-shadow: 0 6px 20px rgba(220, 38, 38, 0.45);
    display: none;
    max-width: 820px;
  }

  .qr-overlay-card {
    background: rgba(15, 23, 42, 0.95);
    border: 3px solid #8b5cf6;
    border-radius: 18px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    color: white;
    box-shadow: 0 12px 30px rgba(0,0,0,0.45);
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
  }

  .qr-overlay-card.hidden { transform: translateX(140%); opacity: 0; pointer-events: none; }
  .qr-white-box { background: white; padding: 6px; border-radius: 10px; line-height: 0; }
  .qr-caption { max-width: 175px; font-size: 0.85em; font-weight: 800; line-height: 1.3; color: #e2e8f0; }
  .qr-caption span { display: block; color: #a7f3d0; font-size: 0.8em; text-transform: uppercase; margin-bottom: 3px; }
</style>
</head>
<body>

  <div class="lower-third-wrapper" id="ltWrapper">
    <div class="announcement-pill" id="ltAnnouncement"></div>

    <div class="badge-main">
      <div class="logo-frame">
        <img id="eventLogo" src="assets/NewLogoMP_Seri1coul_Noir.png" alt="Logo Animation / AssoMultiplayer">
      </div>
      <div class="badge-text">
        <div class="top-meta-row">
          <span class="live-tag" id="liveTag">EN DIRECT • TGS 2026</span>
          <span class="host-chip" id="hostChip">🎙️ AssoMultiplayer</span>
        </div>
        <div class="title" id="eventTitle">ASSOMULTIPLAYER</div>
        <div class="subtitle" id="eventHostLine">Stand Animation & Freeplay</div>
      </div>
    </div>

    <div class="ticker-bar" id="tickerText">
      📍 Stand AssoMultiplayer — Freeplay & Animations
    </div>
  </div>

  <div class="qr-overlay-card hidden" id="qrOverlayCard">
    <div class="qr-white-box" id="overlayQrImg"></div>
    <div class="qr-caption">
      <span>📱 Rejoignez-nous !</span>
      Scannez pour voir le planning & vous inscrire aux quizz !
    </div>
  </div>

  <script>
    let lastRenderedSignature = '';

    function applyLogoWithFallback(targetSrc) {
      const img = document.getElementById('eventLogo');
      const cleanSrc = (targetSrc && String(targetSrc).trim()) ? String(targetSrc).trim() : ASSO_FALLBACK_LOGO;
      img.onerror = function() {
        if (img.getAttribute('src') !== ASSO_FALLBACK_LOGO) {
          img.src = ASSO_FALLBACK_LOGO;
        }
      };
      if (img.getAttribute('src') !== cleanSrc) {
        img.src = cleanSrc;
      }
    }

    function renderQR() {
      try {
        const base = TGSSync.getPublicBaseUrl();
        const url = base ? `${base}/public_companion.html` : window.location.href.replace('streamlabs_lower_third.html', 'public_companion.html');
        const qr = qrcode(0, 'M');
        qr.addData(url);
        qr.make();
        document.getElementById('overlayQrImg').innerHTML = qr.createImgTag(3);
      } catch (e) {}
    }

    function updateOverlay() {
      const state = TGSSync.getOverlayState();
      const allEvents = TGSSync.getEvents();
      const wrapper = document.getElementById('ltWrapper');
      const qrCard = document.getElementById('qrOverlayCard');

      qrCard.classList.toggle('hidden', !state.showQR);

      const annEl = document.getElementById('ltAnnouncement');
      if (state.announcement && state.announcement.trim() !== '') {
        annEl.textContent = '📢 ' + state.announcement.trim();
        annEl.style.display = 'block';
      } else {
        annEl.style.display = 'none';
      }

      if (state.mode === 'HIDDEN') {
        wrapper.classList.add('hidden');
        return;
      }
      wrapper.classList.remove('hidden');

      let activeEvent = null;
      let nextEvent = null;

      if (state.mode === 'MANUAL' && state.manualEventId) {
        activeEvent = allEvents.find(e => Number(e.id) === Number(state.manualEventId)) || null;
      } else {
        const now = new Date();
        const currentTime = now.getHours() * 60 + now.getMinutes();
        const dayName = now.toLocaleDateString('en-US', { weekday: 'long' });
        const today = dayName.charAt(0).toUpperCase() + dayName.slice(1).toLowerCase();

        const todayEvents = allEvents.filter(e => e.day === today);
        const idx = todayEvents.findIndex(event => {
          const startMin = TGSSync.parseTimeToMinutes(event.startTime);
          const endMin = TGSSync.parseTimeToMinutes(event.endTime);
          return currentTime >= startMin && currentTime < endMin;
        });

        if (idx !== -1) {
          activeEvent = todayEvents[idx];
          if (idx + 1 < todayEvents.length) nextEvent = todayEvents[idx + 1];
        } else {
          nextEvent = todayEvents.find(event => TGSSync.parseTimeToMinutes(event.startTime) > currentTime) || null;
        }
      }

      const sig = JSON.stringify({ activeEvent, nextEvent, mode: state.mode });
      if (sig !== lastRenderedSignature) {
        lastRenderedSignature = sig;
        wrapper.style.transform = 'translateY(12px)';
        setTimeout(() => { wrapper.style.transform = ''; }, 60);
      }

      if (activeEvent) {
        const logoUrl = TGSSync.resolveEventLogo(activeEvent);
        applyLogoWithFallback(logoUrl);

        document.getElementById('liveTag').textContent = state.mode === 'MANUAL'
          ? 'SUR SCÈNE • TGS 2026'
          : `EN DIRECT (${activeEvent.startTime} - ${activeEvent.endTime})`;

        const hasHost = activeEvent.hosts && String(activeEvent.hosts).trim() !== '';
        document.getElementById('hostChip').textContent = hasHost
          ? `🎙️ ${activeEvent.hosts}`
          : '🎮 AssoMultiplayer';

        document.getElementById('eventTitle').textContent = activeEvent.event;
        document.getElementById('eventHostLine').textContent = hasHost
          ? `Animation présentée par ${activeEvent.hosts} • Stand AssoMultiplayer`
          : `Stand AssoMultiplayer • Toulouse GameShow 2026`;

        document.getElementById('tickerText').textContent = nextEvent
          ? `⏭️ À SUIVRE (${nextEvent.startTime}) : ${nextEvent.event}${nextEvent.hosts ? ' (' + nextEvent.hosts + ')' : ''}`
          : `📍 Stand AssoMultiplayer — Freeplay Gaming • Cartes Pokémon 3D • Cosplay Photo Booth`;
      } else {
        applyLogoWithFallback(ASSO_FALLBACK_LOGO);
        document.getElementById('liveTag').textContent = 'STAND ASSOMULTIPLAYER • TGS 2026';
        document.getElementById('hostChip').textContent = '🎮 Équipe AssoMultiplayer';
        document.getElementById('eventTitle').textContent = 'FREEPLAY & ANIMATIONS';
        document.getElementById('eventHostLine').textContent = 'Smash Bros • Mario Kart • Pokémon 3D • Cosplay Photo Booth';
        document.getElementById('tickerText').textContent = nextEvent
          ? `⏭️ PROCHAINE ANIMATION À ${nextEvent.startTime} : ${nextEvent.event}`
          : `📍 Retrouvez-nous tout le week-end au Toulouse GameShow !`;
      }
    }

    renderQR();
    updateOverlay();
    TGSSync.onUpdate(() => { renderQR(); updateOverlay(); });
    setInterval(updateOverlay, 5000);
  </script>
</body>
</html>
