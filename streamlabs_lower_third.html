<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Streamlabs / OBS Lower Third - TGS 2026</title>
<script src="schedule.js"></script>
<script src="shared_sync.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { background: transparent; overflow: hidden; height: 100vh; width: 100vw; display: flex; justify-content: flex-start; align-items: flex-end; padding: 36px 44px; }
  .lower-third-wrapper { display: flex; flex-direction: column; gap: 8px; transition: transform 0.35s ease, opacity 0.35s ease; }
  .lower-third-wrapper.hidden { transform: translateY(150px); opacity: 0; pointer-events: none; }
  .badge-main { display: flex; align-items: center; background: linear-gradient(135deg, rgba(46, 16, 101, 0.97), rgba(109, 40, 217, 0.97)); color: white; padding: 12px 24px 12px 14px; border-radius: 20px; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5); border: 2px solid #a7f3d0; max-width: 860px; }
  .logo-frame { width: 78px; height: 78px; min-width: 78px; border-radius: 15px; background: rgba(15, 23, 42, 0.92); border: 2px solid #a7f3d0; display: flex; align-items: center; justify-content: center; padding: 6px; margin-right: 16px; overflow: hidden; }
  .logo-frame img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .badge-text { display: flex; flex-direction: column; min-width: 0; }
  .top-meta-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .live-tag { display: inline-block; background: #10b981; color: #022c22; font-size: 0.68em; font-weight: 900; padding: 2px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
  .host-chip { display: inline-flex; align-items: center; gap: 5px; background: rgba(15, 23, 42, 0.55); border: 1px solid rgba(216, 180, 254, 0.45); color: #f3e8ff; font-size: 0.78em; font-weight: 800; padding: 2px 10px; border-radius: 999px; }
  .badge-text .title { font-size: 1.45em; font-weight: 900; letter-spacing: 0.3px; line-height: 1.15; }
  .badge-text .subtitle { font-size: 0.92em; color: #e9d5ff; font-weight: 800; margin-top: 4px; }
  .ticker-bar { background: rgba(15, 23, 42, 0.94); color: #f8fafc; padding: 8px 18px; border-radius: 12px; font-size: 0.9em; font-weight: 800; border-left: 5px solid #10b981; max-width: 760px; }
  .announcement-pill { background: linear-gradient(90deg, #dc2626, #ea580c); color: white; padding: 10px 20px; border-radius: 12px; font-size: 1.05em; font-weight: 900; border: 2px solid #fca5a5; display: none; max-width: 860px; }
</style>
</head>
<body>
  <div class="lower-third-wrapper" id="ltWrapper">
    <div class="announcement-pill" id="ltAnnouncement"></div>
    <div class="badge-main">
      <div class="logo-frame">
        <img id="eventLogo" src="assets/NewLogoMP_Seri1coul_Noir.png" alt="Logo AssoMultiplayer" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='NewLogoMP_Seri1coul_Noir.png';}">
      </div>
      <div class="badge-text">
        <div class="top-meta-row">
          <span class="live-tag" id="liveTag">EN DIRECT • TGS 2026</span>
          <span class="host-chip" id="hostChip">🎙️ AssoMultiplayer</span>
        </div>
        <div class="title" id="eventTitle">ASSOMULTIPLAYER</div>
        <div class="subtitle" id="eventHostLine">Stand Animation & Freeplay</div>
      </div>
    </div>
    <div class="ticker-bar" id="tickerText">📍 Stand AssoMultiplayer — Freeplay & Animations</div>
  </div>
  <script>
    function applyLogoWithFallback(targetSrc) {
      const img = document.getElementById('eventLogo');
      const cleanSrc = (targetSrc && String(targetSrc).trim()) ? String(targetSrc).trim() : ASSO_FALLBACK_LOGO;
      if (img.getAttribute('src') !== cleanSrc) img.src = cleanSrc;
    }

    function updateOverlay() {
      const state = TGSSync.getOverlayState();
      const allEvents = TGSSync.getEvents();
      const wrapper = document.getElementById('ltWrapper');
      const annEl = document.getElementById('ltAnnouncement');

      const annText = (typeof state.announcement === 'string') ? state.announcement.trim() : '';
      if (annText !== '') {
        annEl.textContent = '📢 ' + annText;
        annEl.style.display = 'block';
      } else {
        annEl.style.display = 'none';
      }

      if (state.mode === 'HIDDEN') {
        wrapper.classList.add('hidden');
        return;
      }
      wrapper.classList.remove('hidden');

      let activeEvent = null, nextEvent = null;
      if (state.mode === 'MANUAL' && state.manualEventId) {
        activeEvent = allEvents.find(e => Number(e.id) === Number(state.manualEventId)) || null;
      } else {
        const now = new Date();
        const currentTime = now.getHours() * 60 + now.getMinutes();
        const dayName = now.toLocaleDateString('en-US', { weekday: 'long' });
        const today = dayName.charAt(0).toUpperCase() + dayName.slice(1).toLowerCase();
        const todayEvents = allEvents.filter(e => e.day === today);
        const idx = todayEvents.findIndex(event => currentTime >= TGSSync.parseTimeToMinutes(event.startTime) && currentTime < TGSSync.parseTimeToMinutes(event.endTime));
        if (idx !== -1) {
          activeEvent = todayEvents[idx];
          if (idx + 1 < todayEvents.length) nextEvent = todayEvents[idx + 1];
        } else {
          nextEvent = todayEvents.find(event => TGSSync.parseTimeToMinutes(event.startTime) > currentTime) || null;
        }
      }

      if (activeEvent) {
        applyLogoWithFallback(TGSSync.resolveEventLogo(activeEvent));
        document.getElementById('liveTag').textContent = state.mode === 'MANUAL' ? 'SUR SCÈNE • TGS 2026' : `EN DIRECT (${activeEvent.startTime} - ${activeEvent.endTime})`;
        const hasHost = activeEvent.hosts && String(activeEvent.hosts).trim() !== '';
        document.getElementById('hostChip').textContent = hasHost ? `🎙️ ${activeEvent.hosts}` : '🎮 AssoMultiplayer';
        document.getElementById('eventTitle').textContent = activeEvent.event;
        document.getElementById('eventHostLine').textContent = hasHost ? `Animation présentée par ${activeEvent.hosts} • Stand AssoMultiplayer` : `Stand AssoMultiplayer • Toulouse GameShow 2026`;
        document.getElementById('tickerText').textContent = nextEvent ? `⏭️ À SUIVRE (${nextEvent.startTime}) : ${nextEvent.event}` : `📍 Stand AssoMultiplayer — Freeplay Gaming • Cartes Pokémon 3D • Cosplay Photo Booth`;
      } else {
        applyLogoWithFallback(ASSO_FALLBACK_LOGO);
        document.getElementById('liveTag').textContent = 'STAND ASSOMULTIPLAYER • TGS 2026';
        document.getElementById('hostChip').textContent = '🎮 Équipe AssoMultiplayer';
        document.getElementById('eventTitle').textContent = 'FREEPLAY & ANIMATIONS';
        document.getElementById('eventHostLine').textContent = 'Smash Bros • Mario Kart • Pokémon 3D • Cosplay Photo Booth';
        document.getElementById('tickerText').textContent = nextEvent ? `⏭️ PROCHAINE ANIMATION À ${nextEvent.startTime} : ${nextEvent.event}` : `📍 Retrouvez-nous tout le week-end au Toulouse GameShow !`;
      }
    }

    async function pollCloudOverlay() {
      if (!TGSSync.isOfflineMode()) {
        await TGSSync.fetchCloudData('all');
        updateOverlay();
      }
    }

    updateOverlay();
    TGSSync.onUpdate(() => updateOverlay());
    pollCloudOverlay();
    setInterval(updateOverlay, 2500);
    setInterval(pollCloudOverlay, 3500);
  </script>
</body>
</html>
