<!DOCTYPE html>
<html lang="fr">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>AssoMultiplayer Schedule & QR - TGS 2026</title>
 <script src="schedule.js"></script>
 <script src="shared_sync.js"></script>
 <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
 <style>
 @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
 * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
 body { background: #f8fafc; color: #0f172a; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
 .panel { background: #ffffff; border-radius: 20px; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.08); border: 1px solid #e2e8f0; }
 .top-header { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 10px 30px; margin: 15px 20px; background: linear-gradient(135deg, #4c1d95, #7c3aed); color: white; box-shadow: 0 8px 25px rgba(139, 92, 246, 0.25); border: none; z-index: 100; }
 .header-left { display: flex; align-items: center; width: 25%; }
 .header-left img { height: 65px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
 .header-center { text-align: center; width: 50%; }
 .header-center h1 { font-size: 2.3em; font-weight: 900; letter-spacing: 2px; margin-bottom: 2px; text-shadow: 2px 2px 0px rgba(0,0,0,0.2); }
 .header-center .subtitle { color: #d8b4fe; font-size: 1.05em; font-weight: 700; letter-spacing: 3px; }
 .header-right { width: 25%; display: flex; justify-content: flex-end; }
 .clock-display { font-size: 1.9em; font-weight: 900; background: rgba(255, 255, 255, 0.1); padding: 8px 22px; border-radius: 15px; border: 2px solid rgba(255, 255, 255, 0.2); }
 .dashboard-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1.25fr 0.75fr; grid-template-rows: auto minmax(0, 1fr); gap: 18px 22px; padding: 0 20px 20px 20px; }
 .announcement-container { grid-column: 1 / 3; grid-row: 1; display: none; background: linear-gradient(90deg, #ef4444, #f59e0b, #ef4444); background-size: 200% 200%; animation: gradientMove 3s ease infinite; color: white; padding: 13px 28px; border-radius: 15px; font-weight: 900; font-size: 1.5em; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); border: 2px solid #fca5a5; white-space: nowrap; overflow: hidden; }
 @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
 .announcement-marquee { display: inline-block; animation: marquee 20s linear infinite; }
 @keyframes marquee { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
 .planning-column { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; gap: 14px; height: 100%; min-height: 0; }
 .ongoing-activities { padding: 14px; }
 .ongoing-title { font-size: 1.05em; font-weight: 900; color: #4c1d95; margin-bottom: 10px; text-align: center; }
 .ongoing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
 .ongoing-item { background: #f8fafc; padding: 8px; border-radius: 10px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px; }
 .ongoing-icon { font-size: 1.4em; }
 .ongoing-name { font-weight: 800; font-size: 0.88em; color: #0f172a; }
 .ongoing-desc { font-size: 0.74em; color: #64748b; }
 .day-section { padding: 14px; flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
 .day-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
 .day-tab { background: #f1f5f9; color: #64748b; border: 2px solid #e2e8f0; padding: 8px 24px; border-radius: 20px; font-weight: 900; font-size: 1.05em; cursor: pointer; }
 .day-tab.active { background: #4c1d95; color: white; border-color: #8b5cf6; }
 .events-container { display: flex; flex-direction: column; gap: 6px; flex: 1; overflow-y: auto; }
 .event-item { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 9px 14px; border-left: 6px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between; }
 .event-item.current { background: #ecfdf5; border-left-color: #10b981; border-color: #a7f3d0; }
 .event-item.next { background: #fffbeb; border-left-color: #f59e0b; border-color: #fde68a; }
 .event-left { display: flex; align-items: center; gap: 14px; }
 .event-time-block { display: flex; flex-direction: column; min-width: 85px; }
 .event-time { font-size: 1.05em; font-weight: 900; color: #475569; }
 .time-badge { font-size: 0.7em; color: #94a3b8; font-weight: 700; }
 .event-title { font-size: 1.12em; font-weight: 900; color: #0f172a; }
 .event-hosts { color: #6d28d9; font-size: 0.88em; font-weight: 700; text-align: right; }
 .side-column { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; gap: 14px; height: 100%; min-height: 0; }
 .qr-schedule-panel { padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; flex: 1; background: linear-gradient(160deg, #ffffff 0%, #f5f3ff 100%); }
 .qr-badge { background: #ede9fe; color: #5b21b6; font-weight: 900; font-size: 0.85em; padding: 5px 14px; border-radius: 999px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.8px; }
 .qr-title { font-size: 1.55em; font-weight: 900; color: #3b0764; margin-bottom: 6px; }
 .qr-desc { font-size: 0.95em; color: #475569; font-weight: 600; margin-bottom: 16px; max-width: 340px; }
 .qr-frame { background: #ffffff; border: 4px solid #7c3aed; border-radius: 22px; padding: 14px; box-shadow: 0 12px 28px rgba(124, 58, 237, 0.18); display: inline-flex; align-items: center; justify-content: center; }
 .qr-url-note { margin-top: 12px; font-size: 0.78em; color: #64748b; font-weight: 700; word-break: break-all; max-width: 340px; }
 </style>
</head>
<body>
 <header class="top-header panel">
  <div class="header-left"><img id="headerLogoImg" src="assets/NewLogoMP_Seri1coul_Noir.png" alt="AssoMultiplayer Logo" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='NewLogoMP_Seri1coul_Noir.png';}else{this.style.display='none';}"></div>
  <div class="header-center"><h1>🎮 ASSOMULTIPLAYER 🎮</h1><div class="subtitle">PROGRAMME STAND • TGS 28 & 29 NOV. 2026</div></div>
  <div class="header-right"><div class="clock-display" id="currentTime"></div></div>
 </header>
 <main class="dashboard-main">
  <div id="announcementBox" class="announcement-container"><div class="announcement-marquee" id="announcementText"></div></div>
  <div class="planning-column">
   <div class="ongoing-activities panel"><div class="ongoing-title">🔄 ACTIVITÉS EN CONTINU</div><div class="ongoing-grid" id="ongoing-grid-container"></div></div>
   <div class="day-section panel">
    <div class="day-tabs">
     <button class="day-tab" id="btn-saturday" onclick="setDisplayDay('Saturday')">SAMEDI 28</button>
     <button class="day-tab" id="btn-sunday" onclick="setDisplayDay('Sunday')">DIMANCHE 29</button>
    </div>
    <div class="events-container" id="daily-events-container"></div>
   </div>
  </div>
  <div class="side-column">
   <div class="qr-schedule-panel panel">
    <div class="qr-badge">📱 Inscriptions Quizz & Tournois</div>
    <div class="qr-title">Scannez pour vous inscrire !</div>
    <div class="qr-desc">Réservez votre place sur les quizz et tournois du stand AssoMultiplayer depuis votre téléphone.</div>
    <div class="qr-frame" id="scheduleQrBox"></div>
    <div class="qr-url-note" id="scheduleQrUrl"></div>
   </div>
  </div>
 </main>
 <script>
 let currentEventId = null, nextEventId = null, activeDisplayDay = 'Saturday';
 function updateTime() { document.getElementById('currentTime').textContent = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
 function checkBroadcastAnnouncement() {
   const st = TGSSync.getOverlayState();
   const msg = (st && typeof st.announcement === 'string') ? st.announcement : (localStorage.getItem('tgs_broadcast_announcement') || '');
   const banner = document.getElementById('announcementBox'), marquee = document.getElementById('announcementText');
   if (msg && msg.trim() !== '') { marquee.textContent = '⚠️ ' + msg.trim() + ' ⚠️'; banner.style.display = 'block'; }
   else banner.style.display = 'none';
 }
 function calculateDuration(start, end) { return `${TGSSync.parseTimeToMinutes(end) - TGSSync.parseTimeToMinutes(start)}min`; }
 function renderOngoingActivities() {
   document.getElementById('ongoing-grid-container').innerHTML = TGSSync.getOngoingActivities().map(act => `
     <div class="ongoing-item"><div class="ongoing-icon">${act.icon || '🎮'}</div><div><div class="ongoing-name">${act.name}</div><div class="ongoing-desc">${act.desc || ''}</div></div></div>
   `).join('');
 }
 function setDisplayDay(day) {
   activeDisplayDay = day;
   document.getElementById('btn-saturday').classList.toggle('active', day === 'Saturday');
   document.getElementById('btn-sunday').classList.toggle('active', day === 'Sunday');
   const container = document.getElementById('daily-events-container');
   container.innerHTML = TGSSync.getEvents().filter(e => e.day === day).map(e => `
     <div class="event-item" data-id="${e.id}">
       <div class="event-left">
         <div class="event-time-block"><span class="event-time">${e.startTime} - ${e.endTime}</span><span class="time-badge">${calculateDuration(e.startTime, e.endTime)}</span></div>
         <div class="event-title">${e.event}</div>
       </div>
       ${e.hosts ? `<div class="event-hosts">🎙️ ${e.hosts}</div>` : ''}
     </div>
   `).join('');
   syncActiveEventFromOverlay();
 }
 function syncActiveEventFromOverlay() {
   const st = TGSSync.getOverlayState(), allEvents = TGSSync.getEvents();
   document.querySelectorAll('.event-item').forEach(item => item.classList.remove('current', 'next'));
   currentEventId = null; nextEventId = null;
   if (st.mode === 'HIDDEN') return;
   let activeEvent = null;
   if (st.mode === 'MANUAL' && st.manualEventId) activeEvent = allEvents.find(e => Number(e.id) === Number(st.manualEventId)) || null;
   else {
     const now = new Date(), curMin = now.getHours() * 60 + now.getMinutes();
     const dayName = now.toLocaleDateString('en-US', { weekday: 'long' });
     const today = dayName.charAt(0).toUpperCase() + dayName.slice(1).toLowerCase();
     const targetDay = (today === 'Saturday' || today === 'Sunday') ? today : activeDisplayDay;
     if (targetDay !== activeDisplayDay) { setDisplayDay(targetDay); return; }
     const dayEvents = allEvents.filter(e => e.day === targetDay);
     const activeIdx = dayEvents.findIndex(e => curMin >= TGSSync.parseTimeToMinutes(e.startTime) && curMin < TGSSync.parseTimeToMinutes(e.endTime));
     if (activeIdx !== -1) activeEvent = dayEvents[activeIdx];
   }
   if (activeEvent) {
     if (activeEvent.day !== activeDisplayDay) { currentEventId = activeEvent.id; setDisplayDay(activeEvent.day); return; }
     currentEventId = activeEvent.id;
     const idx = allEvents.findIndex(e => e.id === activeEvent.id);
     nextEventId = (idx < allEvents.length - 1 && allEvents[idx + 1].day === activeEvent.day) ? allEvents[idx + 1].id : null;
     const curEl = document.querySelector(`[data-id="${currentEventId}"]`);
     if (curEl) curEl.classList.add('current');
     if (nextEventId) { const nxtEl = document.querySelector(`[data-id="${nextEventId}"]`); if (nxtEl) nxtEl.classList.add('next'); }
   }
 }
 function renderScheduleQR() {
   const base = TGSSync.getPublicBaseUrl() || DEFAULT_PUBLIC_BASE_URL;
   const targetUrl = `${base}/public_companion.html`;
   document.getElementById('scheduleQrUrl').textContent = targetUrl;
   const box = document.getElementById('scheduleQrBox');
   try {
     if (typeof qrcode !== 'undefined') {
       const qr = qrcode(0, 'M'); qr.addData(targetUrl); qr.make(); box.innerHTML = qr.createImgTag(6); return;
     }
   } catch (e) {}
   box.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(targetUrl)}" width="220" height="220" alt="QR Code">`;
 }
 TGSSync.onUpdate(() => { checkBroadcastAnnouncement(); renderOngoingActivities(); setDisplayDay(activeDisplayDay); renderScheduleQR(); });
 renderOngoingActivities(); setDisplayDay('Saturday'); renderScheduleQR(); updateTime(); checkBroadcastAnnouncement();
 setInterval(updateTime, 1000); setInterval(checkBroadcastAnnouncement, 1500); setInterval(syncActiveEventFromOverlay, 5000);
 </script>
</body>
</html>
